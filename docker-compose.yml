---
version: '3'
services:
  postgres:
    image: "postgres:16-alpine"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lowendinsight_get_prod
  redis-master:
    image: "redis:alpine"
  lei-get:
    image: "kitplummer/lowendinsight_get:latest"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4444:4444"
    environment:
      - REDIS_URL=redis://redis-master:6379/3
      - DATABASE_URL=ecto://postgres:postgres@postgres/lowendinsight_get_prod
    depends_on:
      - postgres
      - redis-master
